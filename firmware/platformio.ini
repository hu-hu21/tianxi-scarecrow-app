; 稻草人驱鸟控制器 v1
; ESP32 DevKit 30Pin + WT41 雷达 + DFPlayer Mini
; 编译：pio run    烧录：pio run -t upload    串口：pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_LOOP_STACK_SIZE=8192

; 如需 OTA，在 platformio.ini 同目录创建 secrets.ini 并取消下面注释
; upload_protocol = espota
; upload_port = 192.168.1.50
