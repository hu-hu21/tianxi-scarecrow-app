plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tianxi.scarecrow'
    compileSdk 34

    defaultConfig {
        applicationId "com.tianxi.scarecrow"
        minSdk 24
        targetSdk 34
        versionCode 3215
        versionName "3.21.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
